packages:
  - packages/*
  - packages/adapters/*
  - packages/plugins/*
  # Keep sandbox-provider plugins installable as standalone packages without
  # forcing root pnpm-lock.yaml churn for their third-party deps.
  - "!packages/plugins/sandbox-providers/**"
  - packages/plugins/examples/*
  # Keep this smoke fixture installable as a local plugin example without
  # forcing PRs to commit pnpm-lock.yaml for a new workspace importer.
  - "!packages/plugins/examples/plugin-orchestration-smoke-example"
  - server
  - ui
  - cli

patchedDependencies:
  embedded-postgres@18.1.0-beta.16: patches/embedded-postgres@18.1.0-beta.16.patch
  "@embedded-postgres/windows-x64@18.1.0-beta.16": patches/@embedded-postgres__windows-x64@18.1.0-beta.16.patch

overrides:
  "@babel/core": 7.29.7
  "@modelcontextprotocol/sdk": 1.31.0
  http-cache-semantics: 4.3.0
  source-map-js: 1.2.2
  proxy-addr: 2.0.8
  postcss-selector-parser: 7.1.6
  fast-copy: 4.1.0
  "@anthropic-ai/sdk": 0.116.0
  rollup: ">=4.59.0"
  dompurify: 3.4.16
  fast-uri: 3.1.8
  form-data: 4.0.6
  body-parser: 2.3.0
  brace-expansion: 1.1.21
  hono: 4.13.7
  ip-address: 10.7.1
  js-yaml: 4.3.2
  "nanoid@^3.0.0": 3.3.18
  "nanoid@^5.0.0": 5.1.16
  path-to-regexp: 8.4.2
  picomatch: 4.0.5
  qs: 6.16.0
  undici: 7.29.1
  "@hono/node-server": 1.19.15
  esbuild: 0.28.1
  browserslist: 4.28.7
  baseline-browser-mapping: 2.11.0
  vitest: 4.1.11
  vite: 7.3.5
  postcss: 8.5.26
  tar: 7.5.22
  ws: 8.21.0
  react: ^19.2.7
  react-dom: ^19.2.7
  lexical: 0.46.0
  "@lexical/clipboard": 0.46.0
  "@lexical/link": 0.46.0
  "@lexical/list": 0.46.0
  "@lexical/markdown": 0.46.0
  "@lexical/plain-text": 0.46.0
  "@lexical/react": 0.46.0
  "@lexical/rich-text": 0.46.0
  "@lexical/selection": 0.46.0
  "@lexical/utils": 0.46.0

# pnpm 11 blocks dependency scripts by default. SPS explicitly trusts only the
# native/runtime packages it requires; every unlisted transitive build remains
# blocked by strictDepBuilds.
allowBuilds:
  "@embedded-postgres/linux-x64": true
  "@embedded-postgres/windows-x64": true
  cpu-features: false
  es5-ext: false
  esbuild: true
  cbor-extract: true
  protobufjs: true
  sqlite3: true
  ssh2: false
